name: Deploy to Brightcove

on:
  push:
    branches: [main]
    paths: ['*.js', '*.css']   # 直下の JS / CSS が変わったときだけ動かす
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BC_ACCOUNT_ID: ${{ secrets.BC_ACCOUNT_ID }}
      BC_CLIENT_ID: ${{ secrets.BC_CLIENT_ID }}
      BC_CLIENT_SECRET: ${{ secrets.BC_CLIENT_SECRET }}
      BC_REPO_NAME: testRepo
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: アクセストークンを取得
        run: |
          STATUS=$(curl -sS -o /tmp/token.json -w '%{http_code}' \
            -X POST 'https://oauth.brightcove.com/v4/access_token' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -u "$BC_CLIENT_ID:$BC_CLIENT_SECRET" \
            -d 'grant_type=client_credentials')
          echo "OAuth HTTP status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "--- OAuth エラー応答 ---"
            cat /tmp/token.json; echo
            exit 1
          fi

          TOKEN=$(jq -r '.access_token // empty' /tmp/token.json)
          if [ -z "$TOKEN" ]; then
            echo "応答に access_token がありません。"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "BC_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: 直下の JS / CSS をアップロード
        run: |
          shopt -s nullglob
          FILES=(*.js *.css)

          if [ ${#FILES[@]} -eq 0 ]; then
            echo "アップロード対象のファイルがありません。"
            exit 1
          fi

          FAILED=0
          for f in "${FILES[@]}"; do
            STATUS=$(curl -sS -o /tmp/upload.json -w '%{http_code}' \
              -X PUT \
              -H "Authorization: Bearer $BC_TOKEN" \
              --form "contents=@$f" \
              "https://repos.api.brightcove.com/v1/accounts/$BC_ACCOUNT_ID/repos/$BC_REPO_NAME/files/$f")

            if [ "$STATUS" = "200" ] || [ "$STATUS" = "201" ]; then
              echo "OK   $f"
              jq -r '.public_url' /tmp/upload.json
            else
              echo "NG   $f  (HTTP $STATUS)"
              cat /tmp/upload.json; echo
              FAILED=1
            fi
          done

          exit $FAILED
