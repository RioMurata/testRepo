name: Deploy to Brightcove

on:
  push:
    branches: [main]        # 既定ブランチが master ならここを master に
    paths: ['assets/**']   # assets が変わったときだけ動かす
  workflow_dispatch:         # 手動実行も可能にする

env:
  BC_REPO_NAME: player-assets

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: アクセストークンを取得
        run: |
          TOKEN=$(curl -s -u "${{ secrets.BC_CLIENT_ID }}:${{ secrets.BC_CLIENT_SECRET }}" \
            -X POST "https://oauth.brightcove.com/v4/access_token?grant_type=client_credentials" \
            | jq -r .access_token)

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "トークンを取得できません。認証情報と権限を確認してください。"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "BC_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: assets の中身をアップロード
        run: |
          shopt -s nullglob
          for f in assets/*; do
            name=$(basename "$f")
            echo "アップロード中: $name"
            curl -sS --fail-with-body \
              -H "Authorization: Bearer $BC_TOKEN" \
              --form "contents=@$f" \
              -X PUT \
              "https://repos.api.brightcove.com/v1/accounts/${{ secrets.BC_ACCOUNT_ID }}/repos/$BC_REPO_NAME/files/$name"
            echo
          done
